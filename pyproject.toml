[project]
name = "sample-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Grzegorz Spyrka", email = "grzegorz.spyrka@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.2",
    "msgpack>=1.2.1",
    "setuptools >= 78.1.1"
]


[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "sample_api.main:app"
name: CI
on:
  release:
    types: [published]
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.event_name  == 'release' &&  github.event.release.tag_name || github.sha}}  
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.14-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: uv sync --locked --group test
      - name: Run tests
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - uses: astral-sh/ruff-action@v4.1.0
      with:
        src: "./src"
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and export to Docker
      uses: docker/build-push-action@v7
      with:
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
    - name: Push image
      run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
  deploy-dev:
    needs: [build, unit-tests, lint]
    environment: dev
    if: github.ref == 'refs/heads/master' || github.event_name  == 'release' 
    runs-on: ubuntu-latest
    steps:
    - name: Deploy Dev environment
      run: "echo Deploying image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} to dev environment"
    - name: Post-deploy smoke test
      run: |
        echo "Running smoke tests..."
        echo "GET /health -> 200 OK"
        echo "Smoke test passed"
  deploy-prod:
    needs: deploy-dev
    environment: prod
    if: github.event_name  == 'release' 
    runs-on: ubuntu-latest
    steps:
    - name: Deploy prod environment
      run: "echo Deploying image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} to prod environment"
    - name: Post-deploy smoke test
      run: |
        echo "Running smoke tests..."
        echo "GET /health -> 200 OK"
        echo "Smoke test passed"
    - name: Rollback
      if: failure()
      run: echo "Deployment failed! Rollback completed successfully."